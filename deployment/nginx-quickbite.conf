server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 64k;   # orders are small JSON documents
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# To add HTTPS later: get a certificate (for example from Let's Encrypt with a domain name),
# add a second server block with listen 443 ssl, and redirect port 80 to HTTPS.
